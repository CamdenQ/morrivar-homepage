name: Publish site and refresh feeds

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check feed implementation
        run: npm test
      - name: Restore incremental X feed state
        uses: actions/cache/restore@v6
        with:
          path: .cache/x-feed-state.json
          key: x-feed-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: x-feed-state-v1-
      - name: Refresh X posts
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node scripts/refresh_x.mjs
      - name: Save incremental X feed state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/x-feed-state.json
          key: x-feed-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-python@v7
        if: github.event_name != 'schedule' || github.event.schedule == '23 */6 * * *'
        with:
          python-version: '3.12'
      - name: Refresh public YouTube uploads
        if: github.event_name != 'schedule' || github.event.schedule == '23 */6 * * *'
        continue-on-error: true
        run: python scripts/refresh_youtube.py
      - name: Assemble public files
        run: |
          mkdir _site
          cp index.html styles.css script.js x-feed.js CNAME _site/
          cp -R assets data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
